<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Contact Us – Webora</title>

  <!-- SEO -->
  <meta name="description" content="Contact Webora for web development, AI solutions, and startup-friendly digital services." />
  <meta name="keywords" content="Webora contact, web development, startup websites" />
  <meta name="author" content="Kunj Gondaliya" />

  <!-- Styles -->
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="style.css">

  <!-- EmailJS -->
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

  <!-- GSAP -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"></script>
  <script src="animations.js"></script>

  <style>
    body {
      min-width: 1024px;
      margin: 0;
      background: #f8f8f8;
    }

    .contact-hero {
      position: relative;
      overflow: hidden;
      padding: 120px 20px;
      text-align: center;
      background: #6f9283;
    }

    .blob {
      position: absolute;
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, lightyellow, lightgreen);
      opacity: 0.25;
      border-radius: 50%;
      filter: blur(80px);
      animation: float 14s infinite ease-in-out;
    }

    .blob1 { top: -120px; left: -120px; }
    .blob2 { bottom: -150px; right: -100px; animation-delay: 6s; }

    @keyframes float {
      0%,100% { transform: translateY(0); }
      50% { transform: translateY(60px); }
    }

    .contact-form {
      max-width: 520px;
      margin: 40px auto 0;
      background: white;
      padding: 30px;
      border-radius: 14px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.12);
      text-align: left;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .form-group input,
    .form-group textarea {
      width: 100%;
      padding: 12px;
      border-radius: 6px;
      border: 1px solid #ccc;
      font-size: 15px;
    }

    .contact-form button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: #6f9283;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    #form-status {
      margin-top: 15px;
      font-weight: 600;
      text-align: center;
    }
  </style>

  <script>
    emailjs.init("RASd6lt0BlKCGSMqt");
  </script>
</head>

<body>

<!-- Header -->
<header class="site-header">
  <div class="logo-container">
    <img src="assets/icons/HI.jpg" class="logo-img" alt="Webora Logo"
         onclick="location.href='index.html'">
  </div>
</header>

<!-- Navbar -->
<nav>
  <div class="menu">
    <a href="official_page.html">Home</a>
    <a href="services.html">Services</a>
    <a href="pricing.html">Pricing</a>
    <a href="portfolio.html">Portfolio</a>
    <a href="blog.html">Blog</a>
    <a href="careers.html">Careers</a>
    <a href="contact.html" class="active">Contact</a>
    <a href="company.html">About us</a>
  </div>
</nav>

<!-- Contact Hero -->
<section class="contact-hero">
  <div class="blob blob1"></div>
  <div class="blob blob2"></div>

  <h2 style="color: #fff;">Contact Us</h2>
  <p style="color: #f5f5f5;">Have a question? Let’s talk.</p>

  <form id="contactForm" class="contact-form">

    <!-- Honeypot (ANTI-SPAM) -->
    <input type="text" id="company_name" style="display:none" autocomplete="off">

    <div class="form-group">
      <label>Your Name</label>
      <input type="text" id="from_name" required>
    </div>

    <div class="form-group">
      <label>Your Email</label>
      <input type="email" id="subscriber_email" required>
    </div>

    <div class="form-group">
      <label>Your Message</label>
      <textarea id="message" rows="5" required></textarea>
    </div>

    <button type="submit">Send Message</button>
    <div id="form-status"></div>
  </form>
</section>

<footer>
  <p>© 2025 Webora. All rights reserved.</p>
</footer>

<!-- Contact Script -->
<script>
document.getElementById("contactForm").addEventListener("submit", async (e) => {
  e.preventDefault();

  const status = document.getElementById("form-status");

  // 🛑 Honeypot check
  if (document.getElementById("company_name").value) return;

  // 🛑 Rate limit (5 min)
  const last = localStorage.getItem("webora_contact_last");
  if (last && Date.now() - last < 300000) {
    status.textContent = "Please wait before sending another message.";
    status.style.color = "orange";
    return;
  }

  const message = document.getElementById("message").value.trim();
  if (message.length < 15) {
    status.textContent = "Please write a detailed message.";
    status.style.color = "red";
    return;
  }

  localStorage.setItem("webora_contact_last", Date.now());

  status.textContent = "Sending...";
  status.style.color = "#333";

  try {
    await emailjs.send("service_tb07o4u", "template_e2gje16", {
      from_name: document.getElementById("from_name").value,
      subscriber_email: document.getElementById("subscriber_email").value,
      message: message,
      reply_to: document.getElementById("subscriber_email").value
    });

    status.textContent = "Message sent successfully!";
    status.style.color = "green";
    e.target.reset();

  } catch (err) {
    console.error(err);
    status.textContent = "Failed to send message. Try again later.";
    status.style.color = "red";
  }
});
</script>

</body>
</html>
